name: Check upstream mirror
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Compare remote main tips
        env:
          FORK: ${{ github.repository }}
        run: |
          set -euo pipefail
          fork=$(git ls-remote --exit-code "https://github.com/$FORK.git" refs/heads/main)
          upstream=$(git ls-remote --exit-code https://github.com/ziwenhahaha/daily-paper-reader.git refs/heads/main)
          echo "Fork: $fork"
          echo "Upstream: $upstream"
          if [[ "$fork" != "$upstream" ]]; then
            echo "::warning::Mirror differs from upstream. Review the fast-forward instructions in AGENTS.md."
          fi

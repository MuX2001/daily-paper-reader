name: On-demand deep reading
run-name: Deep read ${{ inputs.request_id }} · ${{ inputs.arxiv_id }}
on:
  workflow_call:
    inputs:
      model_choice:
        type: string
        default: configured
        required: false
      arxiv_id:
        required: true
        type: string
      request_id:
        required: true
        type: string
    secrets:
      DEEPSEEK_API_KEY:
        required: false
      DEEPSEEK_MODEL:
        required: false
      DEEPSEEK_BASE_URL:
        required: false
      DEEP_READ_API_KEY:
        required: false
      DEEP_READ_MODEL:
        required: false
      DEEP_READ_BASE_URL:
        required: false
      OBSIDIAN_NOTES_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      model_choice:
        type: string
        default: configured
        required: false
      arxiv_id:
        description: Exact arXiv version, e.g. 1706.03762v7
        required: true
        type: string
      request_id:
        description: Client request identifier
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deep-read-${{ inputs.arxiv_id }}
  cancel-in-progress: false
jobs:
  read:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAPER_ID: ${{ inputs.arxiv_id }}
      REQUEST_ID: ${{ inputs.request_id }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || secrets.DEEPSEEK_MODEL }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || secrets.DEEPSEEK_BASE_URL }}
      DEEP_READ_API_KEY: ${{ secrets.DEEP_READ_API_KEY }}
      DEEP_READ_MODEL: ${{ vars.DEEP_READ_MODEL || secrets.DEEP_READ_MODEL }}
      DEEP_READ_BASE_URL: ${{ vars.DEEP_READ_BASE_URL || secrets.DEEP_READ_BASE_URL }}
      DEEP_READ_MODEL_CHOICE: ${{ inputs.model_choice }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-reader.txt
      - name: Validate inputs
        id: input
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib, os
          from reader_identity import validate_id, validate_request_id
          validate_id(os.environ['PAPER_ID'])
          validate_request_id(os.environ['REQUEST_ID'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as file:
              file.write('key='+hashlib.sha256(os.environ['PAPER_ID'].encode()).hexdigest()+'\n')
          PY
      - name: Check model configuration before downloading or billing
        run: python src/deep_read_config.py
      - run: python -m pip install -r requirements-reader.txt
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/deep-read-cache
          key: deep-read-v1-${{ steps.input.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deep-read-v1-${{ steps.input.outputs.key }}-
      - name: Generate exact-version note
        run: |
          python -u src/deep_read.py --arxiv-id "$PAPER_ID" --request-id "$REQUEST_ID" \
            --cache-dir "$RUNNER_TEMP/deep-read-cache" --output-dir "$RUNNER_TEMP/deep-read-output"
      - name: Sync to configured private Obsidian repository
        if: success() && vars.OBSIDIAN_NOTES_REPO != ''
        env:
          OBSIDIAN_NOTES_REPO: ${{ vars.OBSIDIAN_NOTES_REPO }}
          OBSIDIAN_NOTES_BRANCH: ${{ vars.OBSIDIAN_NOTES_BRANCH || 'main' }}
          OBSIDIAN_NOTES_FOLDER: ${{ vars.OBSIDIAN_NOTES_FOLDER || 'Inbox' }}
          OBSIDIAN_NOTES_TOKEN: ${{ secrets.OBSIDIAN_NOTES_TOKEN }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, os
          from pathlib import Path
          from obsidian_sync import sync_note
          root=Path(os.environ['RUNNER_TEMP'])/'deep-read-output'
          status=json.loads((root/'status.json').read_text())
          result=sync_note(root/status['note'],os.environ['OBSIDIAN_NOTES_REPO'],os.environ['OBSIDIAN_NOTES_BRANCH'],os.environ['OBSIDIAN_NOTES_FOLDER'],os.environ['OBSIDIAN_NOTES_TOKEN'])
          (root/'sync-status.json').write_text(json.dumps(result))
          PY
      - uses: actions/cache/save@v4
        if: always() && steps.input.outcome == 'success'
        with:
          path: ${{ runner.temp }}/deep-read-cache
          key: deep-read-v1-${{ steps.input.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.input.outcome == 'success'
        with:
          name: deep-read-${{ inputs.request_id }}
          path: ${{ runner.temp }}/deep-read-output
          retention-days: 30
          if-no-files-found: warn

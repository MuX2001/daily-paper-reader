name: Reader build and checks
on:
  push:
    branches: [dev]
    paths: ['reader/**', 'src/minmax*', 'src/triage*.py', 'src/reader_*.py', 'src/deep_read*.py', 'src/deep_read_prompt.txt', 'src/obsidian_sync.py', 'requirements-reader.txt', 'tests/test_minmax*.py', 'tests/test_reader*.py', 'tests/test_deep_read*.py', '.github/workflows/deep-read.yml', '.github/workflows/daily-paper-reader.yml', '.github/workflows/reader-publish.yml', 'index.html', 'legacy.html', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'scripts/package_reader.mjs', 'scripts/check_reader_browser.mjs', '.github/workflows/reader-check.yml']
  pull_request:
    paths: ['reader/**', 'index.html', 'package*.json', 'src/minmax*', 'src/triage*.py', 'src/reader_*.py', 'src/deep_read*.py', 'src/deep_read_prompt.txt', 'src/obsidian_sync.py', 'requirements-reader.txt', 'tests/test_minmax*.py', 'tests/test_reader*.py', 'tests/test_deep_read*.py', 'scripts/check_reader_browser.mjs', '.github/workflows/deep-read.yml', '.github/workflows/daily-paper-reader.yml', '.github/workflows/reader-publish.yml', '.github/workflows/reader-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set build output directory
        run: echo "DPR_WEB_OUTPUT_DIR=$RUNNER_TEMP/reader-site" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Validate reader workflow expressions
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes='' \
            .github/workflows/daily-paper-reader.yml .github/workflows/deep-read.yml \
            .github/workflows/reader-check.yml .github/workflows/reader-publish.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-reader.txt
      - run: npm ci
      - run: npm run test:reader
      - run: python -m unittest tests.test_minmax tests.test_minmax_readable tests.test_minmax_narrative tests.test_triage_export tests.test_triage_enrich tests.test_deep_read tests.test_deep_read_chunks tests.test_reader_workflow tests.test_reader_fulltext tests.test_obsidian_sync tests.test_reader_thumbnail tests.test_reader_catalog tests.test_reader_conferences tests.test_reader_feedback tests.test_reader_feedback_eval tests.test_reader_notify tests.test_reader_release -q
      - run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify production UI under Pages subpath
        run: npm run test:reader:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-browser-screenshots
          path: ${{ runner.temp }}/reader-browser-results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: reader-site
          path: ${{ runner.temp }}/reader-site
          include-hidden-files: true
          retention-days: 7

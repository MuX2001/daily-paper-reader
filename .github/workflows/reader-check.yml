name: Reader build and checks
on:
  push:
    branches: [dev]
    paths: ['reader/**', 'src/triage*.py', 'src/reader_catalog.py', 'index.html', 'legacy.html', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'scripts/package_reader.mjs', '.github/workflows/reader-check.yml']
  pull_request:
    paths: ['reader/**', 'index.html', 'package*.json', 'src/triage*.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DPR_WEB_OUTPUT_DIR: ${{ runner.temp }}/reader-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-reader.txt
      - run: npm ci
      - run: npm run test:reader
      - run: python -m unittest tests.test_triage_export tests.test_triage_enrich tests.test_deep_read tests.test_obsidian_sync tests.test_reader_thumbnail tests.test_reader_catalog tests.test_reader_feedback tests.test_reader_notify tests.test_reader_release -q
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: reader-site
          path: ${{ runner.temp }}/reader-site
          include-hidden-files: true
          retention-days: 7

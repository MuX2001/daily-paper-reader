name: Reader build and checks
on:
  push:
    branches: [dev]
    paths: ['reader/**', 'src/triage*.py', 'src/reader_*.py', 'src/deep_read.py', 'src/obsidian_sync.py', 'requirements-reader.txt', 'tests/test_reader*.py', 'tests/test_deep_read.py', '.github/workflows/deep-read.yml', 'index.html', 'legacy.html', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'scripts/package_reader.mjs', 'scripts/check_reader_browser.mjs', '.github/workflows/reader-check.yml']
  pull_request:
    paths: ['reader/**', 'index.html', 'package*.json', 'src/triage*.py', 'src/reader_*.py', 'src/deep_read.py', 'src/obsidian_sync.py', 'requirements-reader.txt', 'tests/test_reader*.py', 'tests/test_deep_read.py', 'scripts/check_reader_browser.mjs', '.github/workflows/deep-read.yml', '.github/workflows/reader-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set build output directory
        run: echo "DPR_WEB_OUTPUT_DIR=$RUNNER_TEMP/reader-site" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-reader.txt
      - run: npm ci
      - run: npm run test:reader
      - run: python -m unittest tests.test_triage_export tests.test_triage_enrich tests.test_deep_read tests.test_reader_workflow tests.test_reader_fulltext tests.test_obsidian_sync tests.test_reader_thumbnail tests.test_reader_catalog tests.test_reader_conferences tests.test_reader_feedback tests.test_reader_notify tests.test_reader_release -q
      - run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify production UI under Pages subpath
        run: npm run test:reader:browser
      - uses: actions/upload-artifact@v4
        with:
          name: reader-site
          path: ${{ runner.temp }}/reader-site
          include-hidden-files: true
          retention-days: 7

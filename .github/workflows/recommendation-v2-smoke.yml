name: Isolated recommendation V2 smoke
on:
  push:
    branches: ['smoke/recommendation-v2-*']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-reader.txt
      - run: python -m unittest discover -s tests -p test_recommendation_v2.py
      - run: python scripts/smoke_recommendation_v2.py "$RUNNER_TEMP/published-feed"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:reader
      - name: Build production reader
        run: DPR_WEB_OUTPUT_DIR="$RUNNER_TEMP/v2-reader" npm run build
      - name: Verify published fixture in compiled reader
        run: |
          npx playwright install --with-deps chromium
          python -m pip install PyNaCl==1.6.2
          DPR_WEB_OUTPUT_DIR="$RUNNER_TEMP/v2-reader" npm run test:reader:browser
      - uses: actions/upload-artifact@v4
        with:
          name: recommendation-v2-smoke-feed
          path: ${{ runner.temp }}/published-feed
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@v4
        with:
          name: recommendation-v2-smoke-feed
          path: ${{ runner.temp }}/retrieved-feed
      - run: diff -r "$RUNNER_TEMP/published-feed" "$RUNNER_TEMP/retrieved-feed"

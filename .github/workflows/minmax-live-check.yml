name: Min-Max paid sample check
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/minmax-live-check.yml', 'scripts/check_minmax_readable_live.py', 'src/minmax.py', 'src/minmax_prompt.txt', 'src/minmax_readable*']
permissions:
  contents: read
jobs:
  sample:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[minmax-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-reader.txt
      - run: python -m pip install -r requirements-reader.txt
      - name: Compare three readable candidates and verify cache replay
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -u scripts/check_minmax_readable_live.py --output "$RUNNER_TEMP/minmax-live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minmax-live-samples
          path: ${{ runner.temp }}/minmax-live
          retention-days: 7
